# medical-rag — a grounded, guardrailed health-information assistant over NIH sources (MedQuAD).
# Everything tunable lives here. The system runs fully without an LLM key (extractive mode).

paths:
  raw: data/medquad_raw
  corpus: data/corpus.parquet
  index_dir: artifacts/index
  eval_dir: data/eval
  reports: reports
  cache: artifacts/llm_cache.sqlite

ingest:
  # One MedQuAD <Document> = one NIH page; each QAPair answer becomes a passage.
  min_answer_chars: 40
  chunk_chars: 900
  chunk_overlap: 120
  dedup: true                       # SHA-1 over normalised text

retrieval:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  bm25: {k1: 0.9, b: 0.4}
  candidate_k: 40                   # from each of BM25 and dense before fusion
  rrf_k: 60
  lexical_weight: 0.3               # swept 0..1 on 500 MedQuAD questions (reports/fusion_sweep.md): 0.3 best; 0.6 (my prior) was worse than dense alone
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n_in: 20
    top_n_out: 5
  # Evidence gate: if the best reranker score is below this, abstain rather than generate.
  min_evidence_score: -2.0

router:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  # Cosine similarity to the nearest route exemplar (see router.py). Below `min_similarity`
  # for every route -> out_of_scope. Measured on data/eval/routing_cases.jsonl:
  # in-scope questions score 0.30-1.00, out-of-scope ones peak at 0.19.
  min_similarity: 0.28
  safety_margin: 0.05             # medical_info vs personal_dosing near-tie -> personal_dosing
  emergency_keywords: [chest pain, can't breathe, cannot breathe, overdose, suicide, kill myself,
                       unconscious, severe bleeding, stroke, heart attack, anaphylaxis, seizure now]

guardrails:
  input:
    max_chars: 2000
    block_pii: true                 # emails, phone numbers, SSN/Aadhaar-like ids, credit cards
    injection_similarity_threshold: 0.55
  output:
    require_citations: true
    groundedness_threshold: 0.45    # min cosine(answer sentence, best cited chunk)
    max_ungrounded_sentences: 0     # any ungrounded claim -> answer is rewritten to cited-only
    disclaimer: "This is general health information from NIH sources, not medical advice. For diagnosis or treatment, consult a licensed clinician."
    forbidden_patterns: ["\\b\\d+(\\.\\d+)?\\s?(mg|mcg|ml|units)\\b.*\\b(take|dose|dosage)\\b", "\\byou should stop taking\\b"]

llm:
  provider: extractive              # extractive | anthropic | openai. Keys come from .env or the UI (memory only).
  models:
    anthropic: claude-haiku-4-5-20251001
    openai: gpt-4o-mini
  judge_models:                     # a stronger model scores faithfulness/relevance, batched 10 answers per call
    anthropic: claude-sonnet-5
    openai: gpt-4o
  max_tokens: 400
  temperature: 0.0
  budget:
    # Hard limits per process. The client refuses to call once any is hit.
    max_calls: 60
    max_input_tokens: 150000
    max_output_tokens: 30000
    max_usd: 2.00
    price_per_mtok:                 # USD per million tokens; unknown models are priced at 15/75 to be safe
      claude-haiku-4-5-20251001: {input: 1.00, output: 5.00}
      claude-sonnet-5: {input: 3.00, output: 15.00}
      gpt-4o-mini: {input: 0.15, output: 0.60}
      gpt-4o: {input: 2.50, output: 10.00}
    cache: true                     # identical (prompt, model) never billed twice

eval:
  retrieval_holdout: 500            # MedQuAD questions held out of nothing - their gold doc is the source page
  seed: 42
  judge_sample: 40                  # answers the LLM judge scores when a key exists (10 per call -> 4 calls)
  llm_generation_sample: 30         # questions answered by the LLM in eval, 5 per call -> 6 calls
